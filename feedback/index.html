<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feedback — SCQ Scoreboard</title>
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" href="/Assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/Assets/logo.png">
  <style>
    :root{
      --bg:#070b14; --panel:#0b1220; --text:#eaf0ff; --muted:#b7c2e1;
      --line:rgba(255,255,255,.10);
      --accent:#facc15;
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;font:16px/1.6 system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    a{color:var(--accent);text-decoration:none}
    .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
    h1{margin:0 0 10px}
    p{color:var(--muted)}
    label{display:block;margin-top:14px;margin-bottom:6px;color:var(--muted);font-size:13px}
    input, textarea{
      width:100%;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      color:var(--text);
      border-radius:12px;
      padding:12px;
      outline:none;
    }
    textarea{min-height:140px;resize:vertical}
    input:focus, textarea:focus{border-color:rgba(250,204,21,.55);box-shadow:0 0 0 3px rgba(250,204,21,.12)}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
    }
    .btn.primary{background:rgba(250,204,21,.95);color:#07101f;border-color:rgba(255,255,255,.20)}
    .btn:hover{background:rgba(255,255,255,.10)}
    .btn.primary:hover{filter:saturate(1.05)}
    .small{font-size:13px;color:var(--muted)}
    .ok{margin-top:12px;font-size:13px;color:rgba(52,211,153,.9)}
    .err{margin-top:12px;font-size:13px;color:rgba(255,120,120,.95)}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/">← Back to site</a>

    <div class="card" style="margin-top:14px;">
      <h1>Feedback</h1>
      <p>
        Found a bug? Have a feature request? Tell me what happened and what you’d like improved.
        The more specific you are (what round, what buttons, what you expected), the faster I can fix it.
      </p>

      <label>Your email (optional)</label>
      <input id="fbEmail" type="email" placeholder="name@example.com" />

      <label>Message</label>
      <textarea id="fbMsg" placeholder="Example: In buzzer round, pressing +2 sometimes…"></textarea>

      <div class="row">
        <button class="btn primary" id="fbSend">Send feedback</button>
        <a class="btn" id="fbMailto" href="mailto:support@scqscoreboard.com?subject=SCQ%20Scoreboard%20Feedback">Email instead</a>
        <span class="small">Response time is usually within 24–48 hours.</span>
      </div>

      <div id="fbStatus" class="small" style="margin-top:10px;"></div>
    </div>
  </div>

  <script>
    // Optional: send to your license server if you add /v1/feedback there.
    // If it fails, users can still click “Email instead”.
    const LICENSE_SERVER = "https://scq-license-server-production.up.railway.app";

    const elEmail = document.getElementById('fbEmail');
    const elMsg = document.getElementById('fbMsg');
    const elStatus = document.getElementById('fbStatus');
    const btn = document.getElementById('fbSend');

    function setStatus(text, kind){
      elStatus.textContent = text || "";
      elStatus.className = kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : 'small';
    }

    btn.addEventListener('click', async () => {
      const email = (elEmail.value || '').trim();
      const message = (elMsg.value || '').trim();

      if (!message) {
        setStatus('Please type a message first.', 'err');
        elMsg.focus();
        return;
      }

      btn.disabled = true;
      setStatus('Sending…');

      try {
        const r = await fetch(LICENSE_SERVER + '/v1/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, message, source: 'website' })
        });

        const data = await r.json().catch(() => ({}));

        if (!r.ok || data?.ok === false) {
          throw new Error(data?.error || ('HTTP ' + r.status));
        }

        setStatus('Thanks — feedback sent ✅', 'ok');
        elMsg.value = '';
      } catch (e) {
        setStatus('Could not send automatically. Please use “Email instead”.', 'err');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
